# Mises a jour automatiques des dependances (une demande de fusion par groupe, testee par la CI avant fusion).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Ces paquets se requierent mutuellement : react et react-dom (meme version majeure), vite et son
      # plugin. Les grouper evite des demandes de fusion separees qui echouent (ERESOLVE). Ils passent
      # avant npm-minor-patch : Dependabot range chaque paquet dans le premier groupe qui le contient.
      react:
        patterns: [react, react-dom]
      vite:
        patterns: [vite, "@vitejs/*"]
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend, /converter, /backup]
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
