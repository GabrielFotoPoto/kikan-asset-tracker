# Mises a jour automatiques des dependances (une demande de fusion par groupe, testee par la CI avant fusion).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Ces paquets se requierent mutuellement : react et react-dom (meme version majeure), vite et son
      # plugin. Les grouper evite des demandes de fusion separees qui echouent (ERESOLVE). Ils passent
      # avant npm-minor-patch : Dependabot range chaque paquet dans le premier groupe qui le contient.
      react:
        patterns: [react, react-dom]
      vite:
        patterns: [vite, "@vitejs/*"]
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend, /converter, /backup]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # Python reste en 3.12 (supporte jusqu'en 2028) : la CI et les scans de securite l'utilisent aussi.
      # A migrer plus tard par etapes (3.13, puis 3.14), en une seule demande de fusion couvrant les
      # images backend et converter et la CI. Retirer cette regle a ce moment-la.
      - dependency-name: python
        versions: [">=3.13"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
