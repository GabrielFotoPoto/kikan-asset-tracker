# Integration continue : a chaque envoi sur main et a chaque demande de fusion.
# Rejoue les memes controles qu'en local (tests/run_all.sh, tests/hygiene_check.py, tests/backup_check.py).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Les tests supposent les noms de reseau et de volumes de la pile de developpement (kikan_default, kikan_*) : on fixe donc le nom du
  # projet, que Docker Compose deduirait sinon du nom du depot (kikan-asset-tracker).
  COMPOSE_PROJECT_NAME: kikan

jobs:
  hygiene:
    name: Hygiene du depot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tests/hygiene_check.py

  workflows:
    name: Securite des workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: actionlint (erreurs et mauvaises pratiques)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: zizmor (analyse de securite des workflows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --no-progress --min-severity medium .github

  dependencies:
    name: Audit des dependances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Dependances Python (pip-audit)
        run: |
          docker run --rm -v "$PWD/backend/requirements.txt:/r.txt:ro" -v "$PWD/tests/audit_deps.py:/a.py:ro" python:3.12-slim python /a.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependances du front (npm audit)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  frontend:
    name: Compilation du front
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build

  tests:
    name: Suites de tests (pile complete)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fichier .env de test (secrets aleatoires, jetables)
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^KIKAN_SECRET_KEY=.*|KIKAN_SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^KIKAN_ADMIN_PASSWORD=.*|KIKAN_ADMIN_PASSWORD=Ci-$(openssl rand -hex 12)-Aa1|" .env
          grep -c '^KIKAN_ADMIN_PASSWORD=Ci-' .env
      - name: Toutes les suites
        run: bash tests/run_all.sh
      - name: Journaux de la pile (en cas d'echec)
        if: failure()
        run: docker compose logs --no-color --tail 200 api db converter

  backup:
    name: Sauvegarde et restauration de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fichier .env de test
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^KIKAN_SECRET_KEY=.*|KIKAN_SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^KIKAN_ADMIN_PASSWORD=.*|KIKAN_ADMIN_PASSWORD=Ci-$(openssl rand -hex 12)-Aa1|" .env
      - name: Pile de developpement
        run: |
          docker compose up -d --build db converter api
          for _ in $(seq 1 60); do curl -sf http://localhost:8080/health >/dev/null && break; sleep 2; done
      - name: Test de sauvegarde et de restauration
        run: python tests/backup_check.py

  images:
    name: Construction des images Docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fichier .env minimal pour la construction
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-build-only|" .env
      - name: Images api, web, converter et sauvegarde
        run: docker compose --profile backup build
      - name: Analyse des vulnerabilites des images (information, ne bloque pas)
        continue-on-error: true   # l'installation de l'outil depend d'un service externe : jamais bloquant
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kikan-api
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
