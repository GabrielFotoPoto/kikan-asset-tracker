services:
  db:
    image: postgres:16
    container_name: kikan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kikan
      POSTGRES_USER: kikan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis (voir .env.example)}
    volumes:
      - kikan_pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kikan -d kikan"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Aucun port publie : la base n'est joignable que par l'API.

  api:
    build: ./backend
    container_name: kikan-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://kikan:${POSTGRES_PASSWORD}@db:5432/kikan
      KIKAN_ENV: ${KIKAN_ENV:-development}
      KIKAN_SECRET_KEY: ${KIKAN_SECRET_KEY:-}
      KIKAN_ADMIN_USER: ${KIKAN_ADMIN_USER:-admin}
      KIKAN_ADMIN_PASSWORD: ${KIKAN_ADMIN_PASSWORD:-}
      KIKAN_TOKEN_TTL_MIN: ${KIKAN_TOKEN_TTL_MIN:-240}
      KIKAN_SIGNATURE_MANUSCRITE_OBLIGATOIRE: ${KIKAN_SIGNATURE_MANUSCRITE_OBLIGATOIRE:-true}
      KIKAN_MAX_CHARTE_MB: ${KIKAN_MAX_CHARTE_MB:-10}
      # Connexion Microsoft 365 (Entra ID), facultative : activee ensuite dans Parametrage, onglet Authentification.
      KIKAN_PUBLIC_URL: ${KIKAN_PUBLIC_URL:-}
      KIKAN_SSO_TENANT_ID: ${KIKAN_SSO_TENANT_ID:-}
      KIKAN_SSO_CLIENT_ID: ${KIKAN_SSO_CLIENT_ID:-}
      KIKAN_SSO_CLIENT_SECRET: ${KIKAN_SSO_CLIENT_SECRET:-}
      KIKAN_SSO_AUTHORITY: ${KIKAN_SSO_AUTHORITY:-https://login.microsoftonline.com}
      KIKAN_SSO_CA_BUNDLE: ${KIKAN_SSO_CA_BUNDLE:-}
      KIKAN_SSO_PROXY: ${KIKAN_SSO_PROXY:-}
      # E-mails (rappels, rapport mensuel) : le serveur SMTP se regle dans Parametrage, onglet E-mails.
      # Mot de passe SMTP, seulement si le serveur en exige un (jamais stocke en base).
      KIKAN_SMTP_PASSWORD: ${KIKAN_SMTP_PASSWORD:-}
      KIKAN_BACKUP_STATUS_DIR: /backupstatus
      KIKAN_BACKUP_ALERT_HOURS: ${KIKAN_BACKUP_ALERT_HOURS:-36}
      # Connecteur GLPI (facultatif) : adresse et reglages dans Parametrage > Integrations ; seuls les jetons se mettent ici.
      KIKAN_GLPI_USER_TOKEN: ${KIKAN_GLPI_USER_TOKEN:-}
      KIKAN_GLPI_APP_TOKEN: ${KIKAN_GLPI_APP_TOKEN:-}
      KIKAN_GLPI_CA_BUNDLE: ${KIKAN_GLPI_CA_BUNDLE:-}
      KIKAN_GLPI_PROXY: ${KIKAN_GLPI_PROXY:-}
      KIKAN_GLPI_ALLOW_HTTP: ${KIKAN_GLPI_ALLOW_HTTP:-}
      # Conversion des chartes Word en PDF (service isole, sans acces Internet). Vide = desactivee.
      KIKAN_WORD_CONVERTER_URL: ${KIKAN_WORD_CONVERTER_URL:-http://converter:8090}
      KIKAN_CORS_ORIGINS: ${KIKAN_CORS_ORIGINS:-http://localhost:3000,https://localhost:3443}
      KIKAN_CERT_DIR: /certs
      KIKAN_ARCHIVE_DIR: /archive
      # Stockage des PDF scelles : local (volume), smb (lecteur reseau) ou webdav (partage web).
      KIKAN_STORAGE_BACKEND: ${KIKAN_STORAGE_BACKEND:-local}
      KIKAN_STORAGE_TIMEOUT_SEC: ${KIKAN_STORAGE_TIMEOUT_SEC:-15}
      KIKAN_STORAGE_DEADLINE_SEC: ${KIKAN_STORAGE_DEADLINE_SEC:-30}
      KIKAN_SMB_SERVER: ${KIKAN_SMB_SERVER:-}
      KIKAN_SMB_SHARE: ${KIKAN_SMB_SHARE:-}
      KIKAN_SMB_PATH: ${KIKAN_SMB_PATH:-}
      KIKAN_SMB_USER: ${KIKAN_SMB_USER:-}
      KIKAN_SMB_PASSWORD: ${KIKAN_SMB_PASSWORD:-}
      KIKAN_SMB_DOMAIN: ${KIKAN_SMB_DOMAIN:-}
      KIKAN_SMB_PORT: ${KIKAN_SMB_PORT:-445}
      KIKAN_SMB_ENCRYPT: ${KIKAN_SMB_ENCRYPT:-true}
      KIKAN_WEBDAV_URL: ${KIKAN_WEBDAV_URL:-}
      KIKAN_WEBDAV_USER: ${KIKAN_WEBDAV_USER:-}
      KIKAN_WEBDAV_PASSWORD: ${KIKAN_WEBDAV_PASSWORD:-}
      KIKAN_WEBDAV_TOKEN: ${KIKAN_WEBDAV_TOKEN:-}
      KIKAN_WEBDAV_CA_BUNDLE: ${KIKAN_WEBDAV_CA_BUNDLE:-}
      KIKAN_WEBDAV_ALLOW_HTTP: ${KIKAN_WEBDAV_ALLOW_HTTP:-false}
      # SharePoint Online (Microsoft Graph) : KIKAN_STORAGE_BACKEND=sharepoint (voir docs/SHAREPOINT.md)
      KIKAN_SHAREPOINT_TENANT_ID: ${KIKAN_SHAREPOINT_TENANT_ID:-}
      KIKAN_SHAREPOINT_CLIENT_ID: ${KIKAN_SHAREPOINT_CLIENT_ID:-}
      KIKAN_SHAREPOINT_CLIENT_SECRET: ${KIKAN_SHAREPOINT_CLIENT_SECRET:-}
      KIKAN_SHAREPOINT_SITE: ${KIKAN_SHAREPOINT_SITE:-}
      KIKAN_SHAREPOINT_LIBRARY: ${KIKAN_SHAREPOINT_LIBRARY:-Documents}
      KIKAN_SHAREPOINT_FOLDER: ${KIKAN_SHAREPOINT_FOLDER:-Kikan}
      KIKAN_SHAREPOINT_CA_BUNDLE: ${KIKAN_SHAREPOINT_CA_BUNDLE:-}
      KIKAN_SHAREPOINT_PROXY: ${KIKAN_SHAREPOINT_PROXY:-}
      # DocuWare : KIKAN_STORAGE_BACKEND=docuware (voir docs/DOCUWARE.md)
      KIKAN_DOCUWARE_URL: ${KIKAN_DOCUWARE_URL:-}
      KIKAN_DOCUWARE_USER: ${KIKAN_DOCUWARE_USER:-}
      KIKAN_DOCUWARE_PASSWORD: ${KIKAN_DOCUWARE_PASSWORD:-}
      KIKAN_DOCUWARE_CABINET: ${KIKAN_DOCUWARE_CABINET:-}
      KIKAN_DOCUWARE_FIELDS: ${KIKAN_DOCUWARE_FIELDS:-}
      KIKAN_DOCUWARE_CA_BUNDLE: ${KIKAN_DOCUWARE_CA_BUNDLE:-}
      KIKAN_DOCUWARE_PROXY: ${KIKAN_DOCUWARE_PROXY:-}
      # KIKAN_TSA_URL: https://freetsa.org/tsr   # optionnel : horodatage PAdES-B-T
    # Acces direct a l'API reserve a la machine locale (dev, tests).
    ports:
      - "127.0.0.1:8080:8000"
    networks:
      - default
      - convnet
    volumes:
      - kikan_certs:/certs
      - kikan_archive:/archive
      - kikan_backupstatus:/backupstatus:ro   # etat de la derniere sauvegarde (ecrit par l'outil de sauvegarde)
      # Autorite de certification interne (PEM) pour un partage WebDAV : deposer le fichier dans ./ca
      # puis definir KIKAN_WEBDAV_CA_BUNDLE=/ca/<fichier>.pem
      - ${KIKAN_CA_DIR:-./ca}:/ca:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  # Conversion Word -> PDF : reseau interne uniquement (aucun acces a Internet ni a la base).
  converter:
    build: ./converter
    container_name: kikan-converter
    restart: unless-stopped
    networks:
      - convnet
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256

  web:
    build: ./frontend
    container_name: kikan-web
    restart: unless-stopped
    environment:
      KIKAN_HTTPS_PORT: ${KIKAN_HTTPS_PORT:-3443}
      KIKAN_TLS_SAN: ${KIKAN_TLS_SAN:-}
    # Par defaut local uniquement. Pour la tablette de signature sur le reseau local,
    # definir KIKAN_BIND=<adresse IP du serveur> dans .env.
    ports:
      - "${KIKAN_BIND:-127.0.0.1}:3000:80"
      - "${KIKAN_BIND:-127.0.0.1}:${KIKAN_HTTPS_PORT:-3443}:443"
    volumes:
      - kikan_webcerts:/etc/nginx/certs
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api

  # Faux serveur de messagerie pour verifier les e-mails avant de brancher le vrai SMTP :
  #   docker compose --profile mail-test up -d mailpit
  # puis, dans Parametrage > E-mails : serveur "mailpit", port 1025, securite "aucune". Messages lisibles sur
  # http://127.0.0.1:8025 (local uniquement). Aucun message ne sort de la machine.
  mailpit:
    image: axllent/mailpit:v1.32
    container_name: kikan-mailpit
    profiles: ["mail-test"]
    restart: "no"
    ports:
      - "127.0.0.1:8025:8025"
    security_opt:
      - no-new-privileges:true

  # Sauvegarde et restauration (docs/SAUVEGARDE.md). Hors de la pile normale : lances a la demande ou par la tache planifiee.
  #   docker compose --profile backup run --rm backup keygen --out /keys    (une fois : genere la paire de cles)
  #   docker compose --profile backup run --rm backup backup                  (une sauvegarde)
  backup:
    build: ./backup
    image: kikan-backup
    profiles: ["backup"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      KIKAN_BACKUP_RECIPIENT: ${KIKAN_BACKUP_RECIPIENT:-}
      KIKAN_BACKUP_KEEP_DAYS: ${KIKAN_BACKUP_KEEP_DAYS:-30}
      KIKAN_BACKUP_KEEP_MONTHS: ${KIKAN_BACKUP_KEEP_MONTHS:-12}
      KIKAN_BACKUP_SMB_SERVER: ${KIKAN_BACKUP_SMB_SERVER:-}
      KIKAN_BACKUP_SMB_SHARE: ${KIKAN_BACKUP_SMB_SHARE:-}
      KIKAN_BACKUP_SMB_PATH: ${KIKAN_BACKUP_SMB_PATH:-}
      KIKAN_BACKUP_SMB_USER: ${KIKAN_BACKUP_SMB_USER:-}
      KIKAN_BACKUP_SMB_PASSWORD: ${KIKAN_BACKUP_SMB_PASSWORD:-}
      KIKAN_BACKUP_SMB_DOMAIN: ${KIKAN_BACKUP_SMB_DOMAIN:-}
      KIKAN_BACKUP_SMB_ENCRYPT: ${KIKAN_BACKUP_SMB_ENCRYPT:-true}
    volumes:
      - kikan_archive:/data/archive:ro
      - kikan_certs:/data/certs:ro
      - kikan_webcerts:/data/webcerts:ro
      - ./.env:/config/.env:ro
      - kikan_backupstatus:/status
      - kikan_backupwork:/work
      # Destination dossier (si pas de partage SMB) : KIKAN_BACKUP_DIR dans .env, ex. un lecteur monte ou un disque externe
      - ${KIKAN_BACKUP_DIR:-./backups}:/backups
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH   # lire les volumes (monte en lecture seule, impose par le noyau)
      - DAC_OVERRIDE      # ecrire dans le dossier de destination, quel qu'en soit le proprietaire (Linux)
    security_opt:
      - no-new-privileges:true
    depends_on:
      - db

  # Restauration : volumes en ecriture, a lancer API et web ARRETES (voir docs/SAUVEGARDE.md et scripts/restore.ps1).
  restore:
    build: ./backup
    image: kikan-backup
    profiles: ["restore"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      KIKAN_BACKUP_SMB_SERVER: ${KIKAN_BACKUP_SMB_SERVER:-}
      KIKAN_BACKUP_SMB_SHARE: ${KIKAN_BACKUP_SMB_SHARE:-}
      KIKAN_BACKUP_SMB_PATH: ${KIKAN_BACKUP_SMB_PATH:-}
      KIKAN_BACKUP_SMB_USER: ${KIKAN_BACKUP_SMB_USER:-}
      KIKAN_BACKUP_SMB_PASSWORD: ${KIKAN_BACKUP_SMB_PASSWORD:-}
      KIKAN_BACKUP_SMB_DOMAIN: ${KIKAN_BACKUP_SMB_DOMAIN:-}
      KIKAN_BACKUP_SMB_ENCRYPT: ${KIKAN_BACKUP_SMB_ENCRYPT:-true}
    volumes:
      - kikan_archive:/data/archive
      - kikan_certs:/data/certs
      - kikan_webcerts:/data/webcerts
      - kikan_backupwork:/work
      - ${KIKAN_BACKUP_DIR:-./backups}:/backups:ro
      - ${KIKAN_BACKUP_IDENTITY:-./backup-identity.txt}:/keys/identity.txt:ro
      - ./restore-output:/out
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    depends_on:
      - db

networks:
  convnet:
    internal: true

volumes:
  kikan_backupstatus:
  kikan_backupwork:
  kikan_pgdata:
  kikan_certs:
  kikan_archive:
  kikan_webcerts:
