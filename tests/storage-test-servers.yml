# Serveurs de TEST (partage SMB Samba + WebDAV HTTPS) pour tests/storage_check.py.
# A lancer sur le reseau de la pile Kikan :
#   docker compose -f tests/storage-test-servers.yml up -d
# Arret et nettoyage :
#   docker compose -f tests/storage-test-servers.yml down -v
name: kikan-storage-test
services:
  ca-init:
    image: alpine:3.20
    command: >
      sh -c "apk add --no-cache openssl >/dev/null &&
      ( [ -f /ca/webdav.crt ] || openssl req -x509 -nodes -newkey rsa:2048 -days 30
      -keyout /ca/webdav.key -out /ca/webdav.crt -subj /CN=kikan-test-webdav
      -addext subjectAltName=DNS:kikan-test-webdav ) && chmod 644 /ca/webdav.key"
    volumes:
      - kikan_test_ca:/ca
  webdav:
    image: hacdias/webdav:latest
    container_name: kikan-test-webdav
    depends_on:
      ca-init:
        condition: service_completed_successfully
    volumes:
      - ./storage-fixtures/webdav.yml:/config.yml:ro
      - kikan_test_ca:/ca:ro
      - kikan_test_dav:/data
    networks: [kikan]
  smb:
    image: dperson/samba:latest
    container_name: kikan-test-smb
    command: -u "kikan;kikan-test-pw-12345" -s "kikan;/share;yes;no;no;kikan" -p
    volumes:
      - kikan_test_smb:/share
    networks: [kikan]
networks:
  kikan:
    name: ${KIKAN_PREFIX:-kikan}_default
    external: true
volumes:
  kikan_test_ca:
    name: kikan_test_ca
  kikan_test_dav:
    name: kikan_test_dav
  kikan_test_smb:
    name: kikan_test_smb
